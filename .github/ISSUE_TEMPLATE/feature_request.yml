name: 功能建议
description: 提议新的扫描、展示或安全清理能力
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 希望解决的问题
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: 安全与隐私影响
      description: 说明是否影响扫描范围、文件删除或数据传输。
