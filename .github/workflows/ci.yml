name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    defaults:
      run:
        working-directory: portable
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: portable/go.mod
          cache-dependency-path: |
            portable/go.mod
            portable/go.sum
      - run: go mod verify
      - run: go test ./...
      - name: Race detection and coverage threshold
        if: runner.os == 'macOS'
        run: |
          go test -race -coverprofile=coverage.out ./...
          COVERAGE=$(go tool cover -func=coverage.out | awk '/total:/ {gsub("%", "", $3); print $3}')
          awk -v coverage="$COVERAGE" 'BEGIN { if (coverage < 65) exit 1 }'
      - run: go vet ./...

  portable-build:
    name: Portable · ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [darwin, windows]
        goarch: [amd64, arm64]
    defaults:
      run:
        working-directory: portable
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: portable/go.mod
          cache-dependency-path: |
            portable/go.mod
            portable/go.sum
      - name: Build without CGO
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -o "${{ runner.temp }}/space-sheriff" .

  web:
    name: Embedded web UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: node --check portable/web/app.js

  python:
    name: Python · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
