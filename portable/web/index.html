<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>空间卫士 Space Sheriff</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div>
      <div class="eyebrow">SPACE SHERIFF <span id="version">v0.2</span></div>
      <h1>看清空间，再安全清理。</h1>
      <p>本地扫描大文件，显示修改时间，并解释每一条删除建议。文件信息不会离开你的电脑。</p>
    </div>
    <button id="quit" class="ghost">退出程序</button>
  </header>

  <main>
    <section class="card controls">
      <div class="field wide">
        <label for="root">扫描位置</label>
        <div class="path-row">
          <select id="roots"></select>
          <input id="root" spellcheck="false" placeholder="输入磁盘或文件夹路径">
        </div>
      </div>
      <div class="field">
        <label for="minimum">最小文件</label>
        <select id="minimum">
          <option value="104857600">100 MB</option>
          <option value="524288000" selected>500 MB</option>
          <option value="1073741824">1 GB</option>
          <option value="5368709120">5 GB</option>
        </select>
      </div>
      <button id="scan" class="primary">开始扫描</button>
      <button id="cancel" class="ghost" disabled>停止</button>
    </section>

    <section id="disk" class="disk card hidden">
      <div>
        <span class="muted">磁盘容量</span>
        <strong id="diskTotal">—</strong>
      </div>
      <div class="bar"><i id="diskUsed"></i></div>
      <div>
        <span class="muted">可用空间</span>
        <strong id="diskFree">—</strong>
      </div>
    </section>

    <section class="card status-card">
      <div class="pulse" id="pulse"></div>
      <div>
        <strong id="status">准备就绪</strong>
        <div id="detail" class="muted">选择位置和阈值后开始扫描。</div>
      </div>
    </section>

    <section id="folderSection" class="card folders hidden">
      <div class="results-head">
        <div>
          <h2>文件夹占用</h2>
          <span id="folderPath" class="muted">—</span>
        </div>
        <button id="folderUp" class="ghost" disabled>返回上一级</button>
      </div>
      <div class="table-wrap folder-table">
        <table>
          <thead><tr><th>文件夹</th><th>大小</th><th>文件数</th><th>最近修改</th><th>占当前目录</th></tr></thead>
          <tbody id="folderRows"></tbody>
        </table>
      </div>
    </section>

    <section class="card results">
      <div class="results-head">
        <div>
          <h2>大文件</h2>
          <span id="count" class="muted">尚未扫描</span>
        </div>
        <div class="legend">
          <span class="safe">通常可清理</span>
          <span class="review">需确认</span>
          <span class="danger">不建议删除</span>
        </div>
      </div>
      <div class="filters">
        <input id="search" type="search" placeholder="搜索路径或文件名">
        <select id="adviceFilter" aria-label="建议筛选">
          <option value="">全部建议</option>
          <option value="safe">通常可清理</option>
          <option value="review">需人工确认</option>
          <option value="danger">不建议删除</option>
        </select>
        <select id="categoryFilter" aria-label="类型筛选">
          <option value="">全部类型</option>
        </select>
        <select id="sort" aria-label="排序">
          <option value="size-desc">大小：从大到小</option>
          <option value="size-asc">大小：从小到大</option>
          <option value="oldest">修改时间：最早优先</option>
          <option value="newest">修改时间：最新优先</option>
          <option value="path">路径</option>
        </select>
      </div>
      <div id="selectionBar" class="selection-bar">
        <label><input id="selectVisible" type="checkbox"> 选择当前可清理结果</label>
        <span id="selectionSummary" class="muted">尚未选择文件</span>
        <button id="clearSelection" class="ghost" disabled>清除选择</button>
        <button id="trashSelected" class="primary" disabled>移入回收站</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th class="check-col"></th><th>大小</th><th>修改时间</th><th>建议</th><th>路径与判断依据</th><th></th></tr></thead>
          <tbody id="rows">
            <tr class="empty"><td colspan="6">扫描结果会显示在这里</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <div id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
